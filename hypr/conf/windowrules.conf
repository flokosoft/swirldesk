windowrule {
    name = float-pavucontrol
    match:class = ^(pavucontrol)$
    float = on
}

windowrule {
    name = float-network-editor
    match:class = ^(nm-connection-editor)$
    float = on
}

windowrule {
    name = pip-floating
    match:title = ^(Picture-in-Picture)$
    float = on
    pin = on
}

windowrule = match:class ^(btop-floating)$, float on
windowrule = match:class ^(btop-floating)$, size 950 620
windowrule = match:class ^(btop-floating)$, center on

# SwirlDesk FIELD status console
# Kept as a compact floating utility. Exact edge-placement is deliberately
# avoided here for compatibility across the Hyprland versions used by SwirlDesk.
windowrule {
    name = field-status
    match:class = ^(field-status)$
    float = on
    size = 550 700
}

# SwirlDesk FIELD native control panel
# CONTROL belongs in the visual center; STATUS remains edge-anchored.
windowrule {
    name = field-control
    match:title = ^(FIELD CONTROL)$
    float = on
    size = 590 760
    center = on
}

# SwirlDesk FIELD native power/session panel
windowrule {
    name = field-power
    match:title = ^(FIELD POWER)$
    float = on
    size = 450 500
    center = on
}
