# SwirlDesk FIELD // Starship v0.4
# Compact field-terminal prompt. No decorative powerline glyph dependency.
add_newline = false
command_timeout = 800

format = "$custom$field_user$directory$git_branch$git_status$cmd_duration$line_break$character"

[custom.field]
command = "printf FIELD"
when = "true"
format = "[ $output ](bold fg:#0b0d0a bg:#a68a5b) "

[username]
show_always = true
style_user = "bold #b3a06d"
style_root = "bold #92534a"
format = "[$user]($style)"

[hostname]
ssh_only = false
style = "#908a7c"
format = "[@$hostname]($style) "

[directory]
style = "bold #d9d3c3"
truncation_length = 4
truncate_to_repo = false
read_only = " RO"
read_only_style = "#c49a52"
format = "[$path]($style)[$read_only]($read_only_style) "

[git_branch]
symbol = "GIT "
style = "#84956b"
format = "[$symbol$branch]($style) "

[git_status]
style = "#c49a52"
format = "[$all_status$ahead_behind]($style) "
conflicted = "!${count} "
ahead = "+${count} "
behind = "-${count} "
diverged = "+${ahead_count}/-${behind_count} "
untracked = "?${count} "
stashed = "S${count} "
modified = "M${count} "
staged = "A${count} "
renamed = "R${count} "
deleted = "D${count} "

[cmd_duration]
min_time = 1500
style = "#908a7c"
format = "[T+$duration]($style) "

[character]
success_symbol = "[›](bold #b3a06d) "
error_symbol = "[›](bold #92534a) "
vimcmd_symbol = "[‹](bold #66705b) "
