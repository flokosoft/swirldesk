# SwirlDesk FIELD Appearance
# Compact, restrained and work-focused.
# Tactical through proportion and palette, not permanent HUD clutter.

general {
    gaps_in = 3
    gaps_out = 7
    border_size = 1

    col.active_border = $accent $olive 45deg
    col.inactive_border = $border_inactive

    layout = dwindle
}

decoration {
    rounding = 2

    blur {
        enabled = false
    }

    shadow {
        enabled = true
        range = 8
        render_power = 2
        color = $shadow_color
    }
}

animations {
    enabled = true

    bezier = field_decel, 0.05, 0.75, 0.15, 1.0
    bezier = field_accel, 0.30, 0.00, 0.75, 0.20
    bezier = field_standard, 0.20, 0.00, 0.00, 1.00

    animation = windows, 1, 3, field_decel, popin 94%
    animation = windowsOut, 1, 2, field_accel, popin 96%
    animation = border, 1, 4, field_standard
    animation = fade, 1, 3, field_decel
    animation = workspaces, 1, 3, field_decel, slide
}

dwindle {
    # pseudotile was removed/changed in newer Hyprland versions.
    # SwirlDesk FIELD intentionally avoids the obsolete option.
    preserve_split = true
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
}

# vfr is a debug option in the Hyprland version used by current SwirlDesk.
debug {
    vfr = true
}
