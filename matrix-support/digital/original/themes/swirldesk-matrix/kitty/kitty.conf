# SwirlDesk MATRIX // Kitty
font_family JetBrainsMono Nerd Font
font_size 11.0

background #050805
foreground #b4dcc1
background_opacity 0.97

cursor #00ff65
cursor_text_color #050805
cursor_shape block

selection_background #173b25
selection_foreground #dcf7e4

# ANSI palette: restrained green terminal with semantic warnings.
color0  #030603
color1  #d76e64
color2  #58ba80
color3  #d8bc70
color4  #38734e
color5  #8eaa91
color6  #62b98e
color7  #b4dcc1

color8  #466853
color9  #ed8b7f
color10 #86e7a5
color11 #ead596
color12 #8bc3af
color13 #b3c9b4
color14 #8cd6b0
color15 #dcf7e4

url_color #00ff65
active_border_color #00b950
inactive_border_color #23412e
bell_border_color #d8bc70

window_padding_width 8
draw_minimal_borders yes
confirm_os_window_close 0

# Keep tabs technical and quiet when they are needed.
tab_bar_min_tabs 2
tab_bar_style separator
tab_separator " // "
active_tab_foreground #050805
active_tab_background #00b950
inactive_tab_foreground #78a58a
inactive_tab_background #0c160f
tab_bar_background #050805
