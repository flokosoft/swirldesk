general {
    hide_cursor = true
    ignore_empty_input = true
    immediate_render = true
}
background {
    monitor =
    path = ~/.config/swirldesk/themes/swirldesk-matrix/wallpapers/matrix-code.png
    color = rgba(050805ff)
    blur_passes = 0
    brightness = 0.45
}
label {
    monitor =
    text = the matrix
    color = rgba(00ff65ff)
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = 32, -30
    halign = left
    valign = top
}
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(b4dcc1ff)
    font_size = 66
    font_family = JetBrainsMono Nerd Font
    position = 0, 130
    halign = center
    valign = center
}
label {
    monitor =
    text = wake up, operator.
    color = rgba(00b950ff)
    font_size = 13
    font_family = JetBrainsMono Nerd Font
    position = 0, 52
    halign = center
    valign = center
}
input-field {
    monitor =
    size = 390, 46
    outline_thickness = 1
    dots_size = 0.20
    dots_spacing = 0.30
    dots_center = true
    outer_color = rgba(00b950ff)
    inner_color = rgba(050805f2)
    font_color = rgba(b4dcc1ff)
    fade_on_empty = false
    placeholder_text = password >
    check_color = rgba(00ff65ff)
    fail_color = rgba(d8bc70ff)
    fail_text = authentication failed: $FAIL
    position = 0, -22
    halign = center
    valign = center
}
label {
    monitor =
    text = session locked
    color = rgba(78a58aff)
    font_size = 10
    font_family = JetBrainsMono Nerd Font
    position = -32, 28
    halign = right
    valign = bottom
}

label {
    monitor =
    text = cmd[update:60000] date +"%Y-%m-%d"
    color = rgba(78a58aff)
    font_size = 12
    font_family = JetBrainsMono Nerd Font
    position = 0, 88
    halign = center
    valign = center
}
label {
    monitor =
    text = local authentication
    color = rgba(78a58aff)
    font_size = 10
    font_family = JetBrainsMono Nerd Font
    position = 0, -70
    halign = center
    valign = center
}
