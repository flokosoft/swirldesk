# MATRIX // dynamic dwindle, compact sharp edges, no blur for laptop efficiency
general {
    gaps_in = 6
    gaps_out = 10
    border_size = 2

    col.active_border = $accent2
    col.inactive_border = $border_inactive

    layout = dwindle
}

decoration {
    rounding = 2

    blur {
        enabled = false
    }

    shadow {
        enabled = true
        range = 10
        render_power = 2
        color = $shadow_color
    }
}

animations {
    enabled = true

    bezier = matrix_decel, 0.05, 0.75, 0.15, 1.0
    bezier = matrix_accel, 0.30, 0.00, 0.75, 0.20
    bezier = matrix_standard, 0.20, 0.00, 0.00, 1.00

    animation = windows, 1, 3, matrix_decel, popin 96%
    animation = windowsOut, 1, 2, matrix_accel, popin 96%
    animation = border, 1, 4, matrix_standard
    animation = fade, 1, 3, matrix_decel
    animation = workspaces, 1, 3, matrix_decel, slide
}

dwindle {
    # pseudotile was removed/changed in newer Hyprland versions.
    # SwirlDesk MATRIX intentionally avoids the obsolete option.
    preserve_split = true
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
}

# vfr is a debug option in the Hyprland version used by current SwirlDesk.
debug {
    vfr = true
}

# Theme-local operator window; never modifies shared rules.
windowrule {
    name = matrix-operator
    match:title = ^(MATRIX OPERATOR)$
    float = on
    center = on
}

# MATRIX-only session menu and report.
windowrule {
    name = matrix-session
    match:title = ^(MATRIX SESSION)$
    float = on
    center = on
}
windowrule {
    name = matrix-system-report
    match:class = ^(matrix-system-info)$
    float = on
    center = on
}
