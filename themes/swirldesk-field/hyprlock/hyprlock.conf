# SwirlDesk FIELD // Hyprlock v0.8
# Same information hierarchy as FIELD STATUS / CONTROL: edge rails + calm center.

general {
    hide_cursor = true
    ignore_empty_input = true
    immediate_render = true
}

background {
    monitor =
    path = ~/.config/swirldesk/themes/swirldesk-field/hyprlock/field-background.png
    color = rgba(0b0d0aff)

    blur_passes = 0
    brightness = 0.60
    contrast = 1.06
    vibrancy = 0.0
}

# Top identity rail ---------------------------------------------------------
label {
    monitor =
    text = FIELD // AUTH
    color = rgba(b3a06dff)
    font_size = 17
    font_family = JetBrains Mono

    position = 34, -28
    halign = left
    valign = top
}

label {
    monitor =
    text = cmd[update:15000] ~/.config/swirldesk/scripts/field-lock-status.sh identity
    color = rgba(908a7ccc)
    font_size = 10
    font_family = JetBrains Mono

    position = 34, -54
    halign = left
    valign = top
}

label {
    monitor =
    text = cmd[update:15000] ~/.config/swirldesk/scripts/field-lock-status.sh profile
    color = rgba(a68a5bcc)
    font_size = 10
    font_family = JetBrains Mono

    position = -34, -32
    halign = right
    valign = top
}

# Calm central authentication zone -----------------------------------------
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(d9d3c3ff)
    font_size = 66
    font_family = JetBrains Mono

    position = 0, 126
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] ~/.config/swirldesk/scripts/field-lock-status.sh time
    color = rgba(908a7ccc)
    font_size = 10
    font_family = JetBrains Mono

    position = 0, 83
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%d %b %Y  //  %A"
    color = rgba(a68a5bff)
    font_size = 13
    font_family = JetBrains Mono

    position = 0, 56
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 390, 44
    outline_thickness = 1

    dots_size = 0.20
    dots_spacing = 0.30
    dots_center = true

    outer_color = rgba(a68a5bff)
    inner_color = rgba(0b0d0af2)
    font_color = rgba(d9d3c3ff)

    fade_on_empty = false
    placeholder_text = AUTHENTICATE // PASSWORD

    position = 0, -24
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:30000] ~/.config/swirldesk/scripts/field-lock-status.sh user
    color = rgba(908a7cdd)
    font_size = 10
    font_family = JetBrains Mono

    position = 0, -67
    halign = center
    valign = center
}

# Bottom status rail: real local system state only -------------------------
label {
    monitor =
    text = cmd[update:10000] ~/.config/swirldesk/scripts/field-lock-status.sh status
    color = rgba(b3a06ddd)
    font_size = 10
    font_family = JetBrains Mono

    position = 34, 28
    halign = left
    valign = bottom
}

label {
    monitor =
    text = SESSION LOCKED // ESC CLEAR
    color = rgba(66705bcc)
    font_size = 9
    font_family = JetBrains Mono

    position = -34, 28
    halign = right
    valign = bottom
}
